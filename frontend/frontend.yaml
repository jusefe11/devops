apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hola-juan

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: hola-juan-frontend:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hola-juan

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
