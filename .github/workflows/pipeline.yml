name: Terraform AWS - Free Tier Check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Consultar AWS y Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. AUTENTICACION AWS MEDIANTE OIDC
      # ======================================================
      - name: Autenticarse en AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::014668143169:role/devops-juan
          aws-region: us-east-1


      # ======================================================
      # 3. VERIFICAR IDENTIDAD AWS
      # ======================================================
      - name: Verificar identidad AWS
        run: aws sts get-caller-identity


      # ======================================================
      # 4. CONSULTAR INSTANCIAS FREE TIER X86_64
      # ======================================================
      - name: Consultar instancias Free Tier x86
        run: |
          aws ec2 describe-instance-types \
            --region us-east-1 \
            --filters Name=free-tier-eligible,Values=true \
            --query "InstanceTypes[?ProcessorInfo.SupportedArchitectures[?@=='x86_64']].InstanceType" \
            --output table


      # ======================================================
      # 5. INSTALAR TERRAFORM
      # ======================================================
      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8


      # ======================================================
      # 6. TERRAFORM INIT
      # Backend remoto S3
      # ======================================================
      - name: Terraform Init
        working-directory: terraform
        run: terraform init


      # ======================================================
      # 7. TERRAFORM FORMAT
      # ======================================================
      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check


      # ======================================================
      # 8. TERRAFORM VALIDATE
      # ======================================================
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


      # ======================================================
      # 9. TERRAFORM PLAN
      # NO CREA NI MODIFICA RECURSOS
      # ======================================================
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false