name: Terraform AWS Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      # 1. Descargar codigo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Autenticarse en AWS mediante OIDC
      - name: Autenticarse en AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::014668143169:role/devops-juan
          aws-region: us-east-1

      # 3. Instalar Terraform
      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      # 4. Inicializar Terraform y backend S3
      - name: Terraform Init
        run: terraform init

      # 5. Verificar formato
      - name: Terraform Format
        run: terraform fmt -check

      # 6. Validar configuracion
      - name: Terraform Validate
        run: terraform validate

      # 7. Crear el plan y guardarlo
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # 8. Aplicar exactamente el plan anterior
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      # 9. Mostrar resultados
      - name: Terraform Outputs
        run: terraform output