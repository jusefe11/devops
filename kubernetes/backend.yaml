# ============================================================
# BACKEND - DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: hola-juan

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

        - name: backend

          # Imagen inicial.
          # GitHub Actions posteriormente cambia esta imagen
          # por la imagen almacenada en Amazon ECR usando
          # el SHA del commit.
          image: hola-juan-backend:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          # ==================================================
          # CONEXION A POSTGRESQL
          # ==================================================

          env:

            - name: DB_HOST
              value: postgres

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          resources:

            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "256Mi"
              cpu: "300m"


---

# ============================================================
# BACKEND - SERVICE
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: hola-juan

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000